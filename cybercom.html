<div id="wheat" style="width:800px; top: 900px; left: 50%; cursor: pointer;" onclick="handleWheatClick(this)">
</div>
<button id="makeYeastButton" style="margin-top: 20px;" onclick="makeYeast()">Make Yeast</button>
<button id="makeBreadButton" style="margin-top: 20px;" onclick="makeBread()">Make Bread</button>
<script>
    function makeBread() {
        const scoreElement = document.getElementById('highScoreDisplay');
        let currentScore = parseInt(scoreElement.textContent.replace('High Score: ', ''));
        
        const wheat = document.getElementById('wheat');
        const yeastElements = Array.from(wheat.children).filter(child => child.style.backgroundImage.includes('yeast.jpg'));
        const flourElements = Array.from(wheat.children).filter(child => child.style.backgroundImage.includes('flour.png'));
        
        if (yeastElements.length > 0 && flourElements.length > 0) {
            currentScore -= 1; // Subtract score for making bread
            scoreElement.textContent = `High Score: ${currentScore}`;
            
            yeastElements[0].remove(); // Remove one yeast element
            flourElements[0].remove(); // Remove one flour element
            
            const bread = document.createElement('div');
            bread.style.width = '100px';
            bread.style.height = '100px';
            bread.style.display = 'inline-block';
            bread.style.margin = '5px';
            bread.style.backgroundImage = 'url("bread.jpg")';
            bread.style.backgroundSize = 'cover';
            bread.style.backgroundPosition = 'center';
            
            wheat.appendChild(bread); // Append bread to the wheat div
        } else {
            alert('Not enough yeast or flour to make bread!');
        }
    }
</script>
<script>
    function makeYeast() {
        const scoreElement = document.getElementById('highScoreDisplay');
        let currentScore = parseInt(scoreElement.textContent.replace('High Score: ', ''));
        
        if (currentScore >= 10) {
            currentScore -= 10;
            scoreElement.textContent = `High Score: ${currentScore}`;
            
            const wheat = document.getElementById('wheat');
            const yeast = document.createElement('div');
            yeast.id = `yeast-${Date.now()}`; // Unique id for yeast
            yeast.style.width = '100px';
            yeast.style.height = '100px';
            yeast.style.display = 'inline-block';
            yeast.style.margin = '5px';
            yeast.style.backgroundImage = 'url("yeast.jpg")';
            yeast.style.backgroundSize = 'cover';
            yeast.style.backgroundPosition = 'center';
            const wheatElements = wheat.children; // Accessing wheat elements as children
            if (wheatElements.length > 0) {
                wheatElements[0].remove(); // Removing one wheat element
            } else {
                alert('No wheat available to make yeast!');
                return;
            }
            yeast.onclick = function() {
                alert('Yeast clicked!');
            };
            
            wheat.appendChild(yeast); // Appending yeast next to the last item
            // Removed misplaced flour-related code from makeYeast function
        } else {
            alert('Not enough score to make flour!');
        }
    }
</script>

      <h1 class="text-3xl font-bold mb-2">Multiplayer Ball Eater & Baker</h1>
    <div id="game-container"></div>

    <div class="inventory-panel">
        <h2>Your Inventory:</h2>

<script>

    <script src="game.js"></script>
<div id="wheat" style="width:800px; top: 900px; left: 50%; cursor: pointer;" onclick="handleWheatClick(this)">
</div>
    <script type="module">// --- Firebase SDK Imports ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, setDoc, deleteDoc, updateDoc, getDocs, serverTimestamp, increment, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-baker-game';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "your-api-key", authDomain: "your-project-id.firebaseapp.com", projectId: "your-project-id" };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Firebase Initialization ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Firestore Collection References ---
        const playersRef = collection(db, `/artifacts/${appId}/public/data/players`);
        const greenBallsRef = collection(db, `/artifacts/${appId}/public/data/greenBalls`);
        const highScoreRef = doc(db, `/artifacts/${appId}/public/data/scores/highScore`);

        let currentUserId = null;


        // --- Phaser Game Scene ---
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.players = {}; 
                this.greenBalls = {};
                this.playerSprite = null;
                this.cursors = null;
            }

            preload() {
                this.load.image('yellowBall', 'https://labs.phaser.io/assets/sprites/yellow_ball.png');
                this.load.image('greenBall', 'https://labs.phaser.io/assets/sprites/green_ball.png');
            }

            create() {
                this.cursors = this.input.keyboard.createCursorKeys();

                onSnapshot(highScoreRef, (doc) => {
                    const score = doc.exists() ? doc.data().value : 0;
                    document.getElementById('highScoreDisplay').textContent = `Global Wheat: ${score}`;
                });

                onAuthStateChanged(auth, user => {
                    if (user) {
                        currentUserId = user.uid;
                        document.getElementById('user-id-display').textContent = currentUserId;
                        this.listenForPlayers();
                        this.listenForGreenBalls();
                        this.initializeGameWorld();
                        
                        window.addEventListener('beforeunload', () => {
                             deleteDoc(doc(playersRef, currentUserId));
                        });
                    }
                });

                if (initialAuthToken) {
                    signInWithCustomToken(auth, initialAuthToken).catch(error => console.error("Custom token sign-in error:", error));
                } else {
                    signInAnonymously(auth).catch(error => console.error("Anonymous sign-in error:", error));
                }
            }

            update() {
                if (this.playerSprite && this.cursors && currentUserId) {
                    const speed = 200;
                    let velocityX = 0;
                    let velocityY = 0;

                    if (this.cursors.left.isDown) velocityX = -speed;
                    else if (this.cursors.right.isDown) velocityX = speed;
                    if (this.cursors.up.isDown) velocityY = -speed;
                    else if (this.cursors.down.isDown) velocityY = speed;

                    this.playerSprite.setVelocity(velocityX, velocityY);

                    if(velocityX !== 0 || velocityY !== 0) {
                        updateDoc(doc(playersRef, currentUserId), {
                            x: this.playerSprite.x,
                            y: this.playerSprite.y,
                        });
                    }
                }
            }

            async initializeGameWorld() {
                const initialBalls = await getDocs(greenBallsRef);
                if (initialBalls.empty) {
                    for (let i = 0; i < 15; i++) {
                        await addDoc(greenBallsRef, {
                            x: Phaser.Math.Between(50, 750),
                            y: Phaser.Math.Between(50, 550)
                        });
                    }
                }
            }

            listenForPlayers() {
                onSnapshot(playersRef, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        const playerData = change.doc.data();
                        const playerId = change.doc.id;

                        if (change.type === "added") {
                            const player = this.physics.add.image(playerData.x, playerData.y, 'yellowBall');
                            player.setCollideWorldBounds(true).setScale(0.5);
                            const scoreText = this.add.text(playerData.x, playerData.y - 30, `Score: ${playerData.score}`, {
                                fontSize: '16px', fill: '#ffffff', stroke: '#000000', strokeThickness: 3
                            }).setOrigin(0.5);
                            player.scoreText = scoreText;
                            this.players[playerId] = player;

                            if (playerId === currentUserId) {
                                this.playerSprite = player;
                            }
                        } else if (change.type === "modified") {
                            if (this.players[playerId]) {
                               if (playerId !== currentUserId) {
                                 this.players[playerId].setPosition(playerData.x, playerData.y);
                               }
                                this.players[playerId].scoreText.setPosition(playerData.x, playerData.y - 30);
                                this.players[playerId].scoreText.setText(`Score: ${playerData.score}`);

                                if(playerId === currentUserId) {
                                    document.getElementById('flour-count').textContent = playerData.flour || 0;
                                    document.getElementById('yeast-count').textContent = playerData.yeast || 0;
                                    document.getElementById('bread-count').textContent = playerData.bread || 0;
                                }
                             }
                        } else if (change.type === "removed") {
                            if (this.players[playerId]) {
                                this.players[playerId].scoreText.destroy();
                                this.players[playerId].destroy();
                                delete this.players[playerId];
                            }
                        }
                    });
                });

                 setDoc(doc(playersRef, currentUserId), {
                    x: Math.random() * 700 + 50,
                    y: Math.random() * 500 + 50,
                    score: 0,
                    id: currentUserId,
                    flour: 0,
                    yeast: 0,
                    bread: 0
                });
            }

            listenForGreenBalls() {
                onSnapshot(greenBallsRef, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        const ballId = change.doc.id;
                        const ballData = change.doc.data();

                        if (change.type === "added") {
                            const ball = this.physics.add.image(ballData.x, ballData.y, 'greenBall').setScale(0.3);
                            this.greenBalls[ballId] = ball;
                            if (this.playerSprite) {
                                this.physics.add.overlap(this.playerSprite, ball, () => this.eatGreenBall(ballId), null, this);
                            }
                        } else if (change.type === "removed") {
                            if (this.greenBalls[ballId]) {
                                this.greenBalls[ballId].destroy();
                                delete this.greenBalls[ballId];
                            }
                        }
                    });
                });
            }

            async eatGreenBall(ballId) {
                if (!this.greenBalls[ballId] || !currentUserId) return;
                
                const ballSprite = this.greenBalls[ballId];
                ballSprite.destroy();
                delete this.greenBalls[ballId];

                try {
                    await deleteDoc(doc(greenBallsRef, ballId));
                    await addDoc(greenBallsRef, { x: Phaser.Math.Between(50, 750), y: Phaser.Math.Between(50, 550) });
                    await updateDoc(doc(playersRef, currentUserId), { score: increment(10) });
                    await setDoc(highScoreRef, { value: increment(10) }, { merge: true });
                } catch(e) { console.error("Error eating ball:", e); }
            }
        }
        
        // --- Button Event Listeners ---
        document.getElementById('reset-score').addEventListener('click', () => {
             setDoc(highScoreRef, { value: 0 });
        });
        
        document.getElementById('play-music').addEventListener('click', () => {
            document.getElementById('background-music').play();
        });

        document.getElementById('stop-music').addEventListener('click', () => {
            const music = document.getElementById('background-music');
            music.pause();
            music.currentTime = 0;
        });

        document.getElementById('make-flour').addEventListener('click', async () => {
            if (!currentUserId) return;
            const highScoreDoc = await getDoc(highScoreRef);
            if (highScoreDoc.exists() && highScoreDoc.data().value >= 10) {
                await setDoc(highScoreRef, { value: increment(-10) }, { merge: true });
                await updateDoc(doc(playersRef, currentUserId), { flour: increment(1) });
            } else {
                alert("Not enough global wheat!");
            }
        });

        document.getElementById('make-yeast').addEventListener('click', async () => {
            if (!currentUserId) return;
            const highScoreDoc = await getDoc(highScoreRef);
            if (highScoreDoc.exists() && highScoreDoc.data().value >= 5) {
                await setDoc(highScoreRef, { value: increment(-5) }, { merge: true });
                await updateDoc(doc(playersRef, currentUserId), { yeast: increment(1) });
            } else {
                alert("Not enough global wheat!");
            }
        });

        document.getElementById('make-bread').addEventListener('click', async () => {
            if (!currentUserId) return;
            const playerDoc = await getDoc(doc(playersRef, currentUserId));
            if (playerDoc.exists() && playerDoc.data().flour >= 1 && playerDoc.data().yeast >= 1) {
                await updateDoc(doc(playersRef, currentUserId), {
                    flour: increment(-1),
                    yeast: increment(-1),
                    bread: increment(1)
                });
            } else {
                alert("Not enough flour and yeast!");
            }
        });


     // --- Game Configuration ---
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            backgroundColor: '#3498db',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 } }
            },
            scene: [GameScene]
        };

        const game = new Phaser.Game(config);
</script>
<button id="makeYeastButton" style="margin-top: 20px;" onclick="makeYeast()">Make Yeast</button>
<button id="makeBreadButton" style="margin-top: 20px;" onclick="makeBread()">Make Bread</button>
<script>
    function makeBread() {
        const scoreElement = document.getElementById('highScoreDisplay');
        let currentScore = parseInt(scoreElement.textContent.replace('High Score: ', ''));
        
        const wheat = document.getElementById('wheat');
        const yeastElements = Array.from(wheat.children).filter(child => child.style.backgroundImage.includes('yeast.jpg'));
        const flourElements = Array.from(wheat.children).filter(child => child.style.backgroundImage.includes('flour.png'));
        
        if (yeastElements.length > 0 && flourElements.length > 0) {
            currentScore -= 10; // Subtract score for making bread
            scoreElement.textContent = `High Score: ${currentScore}`;
            
            yeastElements[0].remove(); // Remove one yeast element
            flourElements[0].remove(); // Remove one flour element
            
            const bread = document.createElement('div');
            bread.style.width = '100px';
            bread.style.height = '100px';
            bread.style.display = 'inline-block';
            bread.style.margin = '5px';
            bread.style.backgroundImage = 'url("bread.jpg")';
            bread.style.backgroundSize = 'cover';
            bread.style.backgroundPosition = 'center';
            
            wheat.appendChild(bread); // Append bread to the wheat div
        } else {
            alert('Not enough yeast or flour to make bread!');
        }
    }
</script>
<script>
    function makeYeast() {
        const scoreElement = document.getElementById('highScoreDisplay');
        let currentScore = parseInt(scoreElement.textContent.replace('High Score: ', ''));
        
        if (currentScore >= 10) {
            currentScore -= 10;
            scoreElement.textContent = `High Score: ${currentScore}`;
            
            const wheat = document.getElementById('wheat');
            const yeast = document.createElement('div');
            yeast.id = `yeast-${Date.now()}`; // Unique id for yeast
            yeast.style.width = '100px';
            yeast.style.height = '100px';
            yeast.style.display = 'inline-block';
            yeast.style.margin = '5px';
            yeast.style.backgroundImage = 'url("yeast.jpg")';
            yeast.style.backgroundSize = 'cover';
            yeast.style.backgroundPosition = 'center';
            const wheatElements = wheat.children; // Accessing wheat elements as children
            if (wheatElements.length > 0) {
                wheatElements[0].remove(); // Removing one wheat element
            } else {
                alert('No wheat available to make yeast!');
                return;
            }
            yeast.onclick = function() {
                alert('Yeast clicked!');
            };
            
            wheat.appendChild(yeast); // Appending yeast next to the last item
            // Removed misplaced flour-related code from makeYeast function
        } else {
            alert('Not enough score to make flour!');
        }
    }
</script>

<div id="content">Waiting for visitor data...</div>

<script>
    // Replace this with your actual public IP address
    const MY_IP = "0.0.0.0";

    fetch('https://api.ipify.org?format=json')
        .then(response => response.json())
        .then(data => {
            const visitorIP = data.ip;

            // Check if the current visitor is you
            if (visitorIP === MY_IP) {
                document.getElementById('content').textContent =
                    "Visitor is you (Filtered out).";
                return;
            }

            document.getElementById('content').textContent =
                "Visitor IP: " + visitorIP;

            // Create a text file containing the visitor IP
            const text = "Visitor IP: " + visitorIP + "\n";
            const blob = new Blob([text], { type: "text/plain" });

            // Download visitors.txt
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "visitors.txt";
            link.click();

            URL.revokeObjectURL(link.href);
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('content').textContent =
                "Unable to retrieve visitor data.";
        });
</script>
